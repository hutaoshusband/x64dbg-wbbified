[cmake]
version = "3.15"
cmkr-include = "cmake/cmkr.cmake"

[options]
X64DBG_BUILD_IN_TREE = true
X64DBG_RELEASE = false
X64DBG_BUILD_MCP = true

[variables]
CMAKE_MODULE_PATH = "${CMAKE_SOURCE_DIR}/cmake"

[project]
name = "x64dbg"
description = "An open-source x64/x32 debugger for windows."
msvc-runtime = "dynamic"
include-before = [
    "cmake/VSToolchain.cmake"
]
include-after = [
    "cmake/VSFlags.cmake",
]

[conditions]
x86 = "CMAKE_SIZEOF_VOID_P EQUAL 4"
x64 = "CMAKE_SIZEOF_VOID_P EQUAL 8"
mcp = "X64DBG_BUILD_MCP"

[find-package]
Qt5 = { components = ["Widgets", "WinExtras"] }

[subdir."src/zydis_wrapper"]
[subdir."src/gui/Src/ThirdPartyLibs/md4c"]
[subdir."src/third_party"]
[subdir."src/tests"]

[target.bridge]
type = "shared"
sources = [
    "src/bridge/*.cpp",
    "src/bridge/*.c",
    "src/bridge/*.h",
]
private-compile-definitions = [
    "BUILD_BRIDGE",
]
msvc.link-options = [
    # Do not embed the absolute build path (which contains the repo name) in the PE
    "/PDBALTPATH:$<TARGET_PDB_FILE_NAME:bridge>",
]
compile-features = ["cxx_std_17"]

[target.bridge.properties]
x86.OUTPUT_NAME = "winbridge"
x64.OUTPUT_NAME = "winbridge"

[target.btparser]
type = "static"
sources = [
    "src/dbg/btparser/btparser/lexer.cpp",
    "src/dbg/btparser/btparser/helpers.h",
    "src/dbg/btparser/btparser/keywords.h",
    "src/dbg/btparser/btparser/lexer.h",
    "src/dbg/btparser/btparser/operators.h",
    "src/dbg/btparser/btparser/parser.h",
    "src/dbg/btparser/btparser/testfiles.h",
]
include-directories = [
    "src/dbg/btparser",
]
clang-any.compile-options = ["-Wno-self-assign-field"]
compile-features = ["cxx_std_17"]

[target.dbg]
type = "shared"
sources = [
    "src/dbg/*.cpp",
    "src/dbg/*.c",
    "src/dbg/*.h",
    "src/dbg/analysis/*.cpp",
    "src/dbg/analysis/*.h",
    "src/dbg/commands/*.cpp",
    "src/dbg/commands/*.h",
    "src/dbg/DeviceNameResolver/*.h",
    "src/dbg/jansson/*.h",
    "src/dbg/lz4/*.h",
    "src/dbg/msdia/*.cpp",
    "src/dbg/msdia/*.h",
    "src/dbg/ntdll/*.h",
    "src/dbg/TitanEngine/*.h",
    "src/dbg/WinInet-Downloader/*.cpp",
    "src/dbg/WinInet-Downloader/*.h",
    "src/dbg/XEDParse/*.h",
]
private-link-libraries = [
    "::zydis_wrapper",
    "::bridge",
    "::btparser",
    "Psapi",
    "Shlwapi",
    "Ws2_32",
    "Wininet",
    "Iphlpapi",
]
x86.private-link-libraries = [
    "src/dbg/dbghelp/dbghelp_x86.lib",
    "src/dbg/DeviceNameResolver/DeviceNameResolver_x86.lib",
    "src/dbg/jansson/jansson_x86.lib",
    "src/dbg/lz4/lz4_x86.lib",
    "src/dbg/ntdll/ntdll_x86.lib",
    "src/dbg/TitanEngine/TitanEngine_x86.lib",
    "src/dbg/XEDParse/XEDParse_x86.lib",
    "src/dbg/LLVMDemangle/LLVMDemangle_x86.lib",
]
x64.private-link-libraries = [
    "src/dbg/dbghelp/dbghelp_x64.lib",
    "src/dbg/DeviceNameResolver/DeviceNameResolver_x64.lib",
    "src/dbg/jansson/jansson_x64.lib",
    "src/dbg/lz4/lz4_x64.lib",
    "src/dbg/ntdll/ntdll_x64.lib",
    "src/dbg/TitanEngine/TitanEngine_x64.lib",
    "src/dbg/XEDParse/XEDParse_x64.lib",
    "src/dbg/LLVMDemangle/LLVMDemangle_x64.lib",
]
private-compile-definitions = [
    "BUILD_DBG",
    "NOMINMAX",
]
private-include-directories = [
    "src/dbg",
    "src/dbg/analysis",
    "src/dbg/commands",
]
msvc.link-options = [
    "/DELAYLOAD:TitanEngine.dll",
    "/PDBALTPATH:$<TARGET_PDB_FILE_NAME:dbg>",
]
msvc.link-libraries = [
    "Delayimp",
]
compile-features = ["cxx_std_17"]

[target.dbg.properties]
x86.OUTPUT_NAME = "wininspect"
x64.OUTPUT_NAME = "wininspect"

[target.gui]
type = "shared"
sources = [
    "src/gui/**.cpp",
    "src/gui/**.h",
    "src/gui/**.ui",
    "src/gui/**.qrc",
]
private-link-libraries = [
    "Qt5::Widgets",
    "Qt5::WinExtras",
    "::zydis_wrapper",
    "::bridge",
    "::md4c-html",
    "winmm",
    "wininet",
    "dwmapi"
]
x86.private-link-libraries = [
    "src/gui/Src/ThirdPartyLibs/ldconvert/ldconvert_x86.lib",
]
x64.private-link-libraries = [
    "src/gui/Src/ThirdPartyLibs/ldconvert/ldconvert_x64.lib",
]
private-include-directories = [
    "src",
    "src/gui/Src",
    "src/gui/Src/Gui",
    "src/gui/Src/BasicView",
    "src/gui/Src/Disassembler",
    "src/gui/Src/Memory",
    "src/gui/Src/Bridge",
    "src/gui/Src/Global",
    "src/gui/Src/Utils",
    "src/gui/Src/ThirdPartyLibs/ldconvert",
]
private-compile-definitions = [
    "BUILD_LIB",
    "NOMINMAX",
    "X64DBG",
]
X64DBG_RELEASE.compile-definitions = ["X64DBG_RELEASE"]
msvc.link-options = [
    "/PDBALTPATH:$<TARGET_PDB_FILE_NAME:gui>",
]
include-after = ["cmake/deps.cmake"]
compile-features = ["cxx_std_17"]

[target.gui.properties]
x86.OUTPUT_NAME = "wingui"
x64.OUTPUT_NAME = "wingui"
AUTOMOC = true
AUTORCC = true
AUTOUIC = true

[target.exe]
type = "executable"
msvc-runtime = "static"
sources = [
    "src/exe/*.cpp",
    "src/exe/*.h",
    "src/exe/manifest.xml",
    "src/exe/resource.rc",
    "src/exe/strings_utf8.rc",
]
x86.sources = ["src/exe/icon32.rc"]
x64.sources = ["src/exe/icon64.rc"]
link-libraries = [
    "::bridge",
    "Wintrust",
]
msvc.link-options = [
    # resource.rc already embeds manifest.xml as RT_MANIFEST, so disable the
    # linker's default manifest to avoid embedding a second one.
    "/MANIFEST:NO",
    "/DELAYLOAD:user32.dll",
    "/DELAYLOAD:wintrust.dll",
    "/DELAYLOAD:$<TARGET_FILE_NAME:bridge>",
    "/PDBALTPATH:$<TARGET_PDB_FILE_NAME:exe>",
    "/NOIMPLIB",
    "/NOEXP",
    "/LARGEADDRESSAWARE",
]
msvc.link-libraries = [
    "Delayimp",
]
# Make the executable build everything
dependencies = [
    "dbg",
    "gui",
    "loaddll",
    "deps",
    "third_party",
]
compile-features = ["cxx_std_17"]

[target.exe.properties]
x86.OUTPUT_NAME = "wininspect"
x64.OUTPUT_NAME = "wininspect"
x86.ARCHIVE_OUTPUT_NAME = "wininspect_exe"
x64.ARCHIVE_OUTPUT_NAME = "wininspect_exe"
x86.PDB_NAME = "wininspect_exe"
x64.PDB_NAME = "wininspect_exe"
WIN32_EXECUTABLE = "ON"

[target.loaddll]
type = "executable"
msvc-runtime = "static"
sources = [
    "src/loaddll/loaddll.cpp",
]
x86.link-libraries = [
    "src/dbg/ntdll/ntdll_x86.lib",
]
x64.link-libraries = [
    "src/dbg/ntdll/ntdll_x64.lib",
]
msvc.link-options = [
    "/DELAYLOAD:user32.dll",
    "/PDBALTPATH:$<TARGET_PDB_FILE_NAME:loaddll>",
]
msvc.link-libraries = [
    "Delayimp",
]
compile-features = ["cxx_std_17"]

[target.loaddll.properties]
WIN32_EXECUTABLE = "ON"

[target.headless]
type = "executable"
sources = [
    "src/headless/*.cpp",
    "src/headless/*.h",
]
link-libraries = [
    "::bridge",
]
msvc.link-options = [
    "/LARGEADDRESSAWARE",
]
dependencies = ["exe"]
compile-features = ["cxx_std_17"]

[target.mcp_common]
type = "static"
condition = "mcp"
sources = ["src/mcp/common/*.cpp", "src/mcp/common/*.h"]
include-before = ["src/mcp/dependencies.cmake"]
include-directories = ["src/mcp/common"]
link-libraries = ["mcp_json", "advapi32", "bcrypt"]
compile-features = ["cxx_std_17"]
compile-definitions = ["WIN32_LEAN_AND_MEAN", "NOMINMAX", "_WIN32_WINNT=0x0601"]

[target.mcp_broker]
type = "executable"
condition = "mcp"
sources = ["src/mcp/broker/*.cpp"]
link-libraries = ["::mcp_common"]
compile-features = ["cxx_std_17"]
msvc.link-options = ["/MANIFEST:EMBED", "/MANIFESTUAC:level='asInvoker' uiAccess='false'"]

[target.mcp_broker.properties]
OUTPUT_NAME = "wininspect-mcp"
EXCLUDE_FROM_ALL = true

[target.mcp_connect]
type = "executable"
condition = "mcp"
sources = ["src/mcp/connect/*.cpp"]
link-libraries = ["::mcp_common"]
compile-features = ["cxx_std_17"]
msvc.link-options = ["/MANIFEST:EMBED", "/MANIFESTUAC:level='asInvoker' uiAccess='false'"]

[target.mcp_connect.properties]
OUTPUT_NAME = "wininspect-mcp-connect"
EXCLUDE_FROM_ALL = true

[target.mcp_worker]
type = "static"
condition = "mcp"
sources = ["src/dbg/mcp/*.cpp", "src/dbg/mcp/*.h"]
include-directories = ["src/dbg/mcp"]
link-libraries = ["::mcp_common"]
compile-features = ["cxx_std_17"]

[target.mcp_contract_fixture]
type = "executable"
condition = "mcp"
sources = ["src/mcp/testing/contracts.cpp"]
link-libraries = ["::mcp_common", "::mcp_worker", "mcp_http", "mcp_sqlite", "mcp_quickjs"]
compile-features = ["cxx_std_17"]
msvc.link-options = ["/MANIFEST:EMBED", "/MANIFESTUAC:level='asInvoker' uiAccess='false'"]

[target.mcp_contract_fixture.properties]
OUTPUT_NAME = "wininspect-mcp-contract-fixture"
EXCLUDE_FROM_ALL = true

[target.mcp_launch_reference]
type = "executable"
condition = "mcp"
sources = ["src/mcp/testing/launch_reference.cpp"]
link-libraries = ["mcp_json"]
compile-features = ["cxx_std_17"]
msvc.link-options = ["/MANIFEST:EMBED", "/MANIFESTUAC:level='asInvoker' uiAccess='false'"]

[target.mcp_launch_reference.properties]
OUTPUT_NAME = "wininspect-mcp-launch-reference"
EXCLUDE_FROM_ALL = true
